<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="system-ui, -apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1100" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="600" fill="#222">
    Three layers, one workflow
  </text>
  <text x="550" y="58" text-anchor="middle" font-size="14" fill="#777">
    Rules constrain the agent · Plans gate the prose · Manuscript carries the draft
  </text>

  <!-- =========================================================== -->
  <!-- USER BAR (top)                                              -->
  <!-- =========================================================== -->
  <rect x="40" y="86" width="1020" height="64" rx="8" fill="#fef6f3" stroke="#c0392b" stroke-width="1.5"/>
  <text x="60" y="118" font-size="18" font-weight="600" fill="#c0392b">YOU</text>
  <text x="60" y="138" font-size="14" fill="#444">in LLMRedPen — read in a paper-like view, mark up, diff across rounds</text>

  <!-- Arrows from User down to each card -->
  <g stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="156" x2="180" y2="195"/>
    <line x1="550" y1="156" x2="550" y2="195"/>
    <line x1="920" y1="156" x2="920" y2="195"/>
  </g>
  <text x="195" y="180" font-size="13" font-style="italic" fill="#555">edit</text>
  <text x="565" y="180" font-size="13" font-style="italic" fill="#555">review · approve</text>
  <text x="935" y="180" font-size="13" font-style="italic" fill="#555">annotate · diff</text>

  <!-- =========================================================== -->
  <!-- THREE LAYER CARDS (middle)                                  -->
  <!-- =========================================================== -->

  <!-- Card 1: RULES -->
  <rect x="40" y="200" width="280" height="120" rx="10" fill="#f0f4e8" stroke="#6e8a4a" stroke-width="1.5"/>
  <text x="180" y="248" text-anchor="middle" font-size="30" font-weight="700" fill="#3d4f24">RULES</text>
  <text x="180" y="284" text-anchor="middle" font-size="14" font-style="italic" fill="#555">the constraints the agent obeys</text>

  <!-- Card 2: PLANS -->
  <rect x="410" y="200" width="280" height="120" rx="10" fill="#fff5d4" stroke="#b78a1f" stroke-width="1.5"/>
  <text x="550" y="248" text-anchor="middle" font-size="30" font-weight="700" fill="#6a4f00">PLANS</text>
  <text x="550" y="284" text-anchor="middle" font-size="14" font-style="italic" fill="#555">the review gate before any prose</text>

  <!-- Card 3: MANUSCRIPT -->
  <rect x="780" y="200" width="280" height="120" rx="10" fill="#fceee8" stroke="#a85c3a" stroke-width="1.5"/>
  <text x="920" y="248" text-anchor="middle" font-size="30" font-weight="700" fill="#6b3520">MANUSCRIPT</text>
  <text x="920" y="284" text-anchor="middle" font-size="14" font-style="italic" fill="#555">the draft itself + self-review</text>

  <!-- Arrows from Agent up to each card -->
  <g stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="370" x2="180" y2="325"/>
    <line x1="550" y1="370" x2="550" y2="325"/>
    <line x1="920" y1="370" x2="920" y2="325"/>
  </g>
  <text x="195" y="352" font-size="13" font-style="italic" fill="#555">read</text>
  <text x="565" y="352" font-size="13" font-style="italic" fill="#555">draft · revise</text>
  <text x="935" y="352" font-size="13" font-style="italic" fill="#555">emit · self-review</text>

  <!-- =========================================================== -->
  <!-- AGENT BAR (bottom)                                          -->
  <!-- =========================================================== -->
  <rect x="40" y="376" width="1020" height="64" rx="8" fill="#f4f4f4" stroke="#777" stroke-width="1.5"/>
  <text x="60" y="408" font-size="18" font-weight="600" fill="#333">WRITING AGENT</text>
  <text x="60" y="428" font-size="14" fill="#444">drafts plan first · awaits approval · emits prose only after the gate opens</text>
</svg>
