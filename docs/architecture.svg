<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="system-ui, -apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrow-small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="#ffffff"/>

  <!-- Title + subtitle -->
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#222">
    Three layers, one pipeline
  </text>
  <text x="550" y="62" text-anchor="middle" font-size="15" fill="#777">
    Rules constrain everything below · Plans gate the prose · Manuscript carries the draft
  </text>

  <!-- Dialogue channel between YOU and AGENT -->
  <text x="550" y="98" text-anchor="middle" font-size="13" font-style="italic" fill="#999" letter-spacing="0.06em">
    rounds of comments + revisions
  </text>
  <line x1="220" y1="115" x2="880" y2="115" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- =========================================================== -->
  <!-- LEFT PANEL — YOU                                            -->
  <!-- Narrowed so the panel hugs its content; header is stacked   -->
  <!-- (icon above name) to fit the narrower width.                -->
  <!-- =========================================================== -->
  <rect x="70" y="130" width="160" height="540" rx="10" fill="#fef6f3" stroke="#e8b4a5" stroke-width="1.5"/>

  <!-- Person icon (centred in panel) -->
  <g transform="translate(150, 160)">
    <circle cx="0" cy="-8" r="9" fill="#c0392b"/>
    <path d="M-14,18 Q-14,2 0,2 Q14,2 14,18 Z" fill="#c0392b"/>
  </g>
  <text x="150" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#c0392b" letter-spacing="0.04em">YOU</text>
  <text x="150" y="223" text-anchor="middle" font-size="12" font-style="italic" fill="#999">in LLMRedPen</text>

  <!-- Separator inside left panel -->
  <line x1="82" y1="240" x2="218" y2="240" stroke="#f0d4cc" stroke-width="1"/>

  <!-- Action labels (centred, each block's visual centre = card centre) -->
  <!-- RULES card centre y=260 -->
  <text x="150" y="266" text-anchor="middle" font-size="18" font-style="italic" fill="#333">maintain</text>

  <!-- PLANS card centre y=420 -->
  <text x="150" y="414" text-anchor="middle" font-size="18" font-style="italic" fill="#333">review</text>
  <text x="150" y="436" text-anchor="middle" font-size="18" font-style="italic" fill="#333">approve</text>

  <!-- MANUSCRIPT card centre y=580 -->
  <text x="150" y="574" text-anchor="middle" font-size="18" font-style="italic" fill="#333">annotate</text>
  <text x="150" y="596" text-anchor="middle" font-size="18" font-style="italic" fill="#333">diff</text>

  <!-- Arrows from left panel into the cards (at card centres) -->
  <line x1="232" y1="260" x2="278" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>
  <line x1="232" y1="420" x2="278" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>
  <line x1="232" y1="580" x2="278" y2="580" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>

  <!-- =========================================================== -->
  <!-- RIGHT PANEL — WRITING AGENT (mirror of YOU)                 -->
  <!-- =========================================================== -->
  <rect x="870" y="130" width="160" height="540" rx="10" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5"/>

  <!-- Robot icon (centred in panel) -->
  <g transform="translate(950, 160)">
    <line x1="0" y1="-15" x2="0" y2="-19" stroke="#555" stroke-width="1.5"/>
    <circle cx="0" cy="-21" r="2.5" fill="#555"/>
    <rect x="-13" y="-15" width="26" height="22" rx="3" fill="#555"/>
    <circle cx="-5" cy="-7" r="2.5" fill="#fff"/>
    <circle cx="5" cy="-7" r="2.5" fill="#fff"/>
    <rect x="-6" y="0" width="12" height="2.8" rx="1" fill="#fff"/>
  </g>
  <text x="950" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#333" letter-spacing="0.04em">AGENT</text>
  <text x="950" y="223" text-anchor="middle" font-size="12" font-style="italic" fill="#999">the LLM</text>

  <!-- Separator inside right panel -->
  <line x1="882" y1="240" x2="1018" y2="240" stroke="#ddd" stroke-width="1"/>

  <!-- Action labels (centred, each block's visual centre = card centre) -->
  <!-- RULES card centre y=260 -->
  <text x="950" y="266" text-anchor="middle" font-size="18" font-style="italic" fill="#333">consult</text>

  <!-- PLANS card centre y=420 -->
  <text x="950" y="414" text-anchor="middle" font-size="18" font-style="italic" fill="#333">draft</text>
  <text x="950" y="436" text-anchor="middle" font-size="18" font-style="italic" fill="#333">revise</text>

  <!-- MANUSCRIPT card centre y=580 -->
  <text x="950" y="574" text-anchor="middle" font-size="18" font-style="italic" fill="#333">emit</text>
  <text x="950" y="596" text-anchor="middle" font-size="18" font-style="italic" fill="#333">self-review</text>

  <!-- Arrows from right panel into the cards (at card centres) -->
  <line x1="868" y1="260" x2="822" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>
  <line x1="868" y1="420" x2="822" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>
  <line x1="868" y1="580" x2="822" y2="580" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>

  <!-- =========================================================== -->
  <!-- Centre column: the three layer cards                        -->
  <!-- =========================================================== -->

  <!-- Layer 1: RULES -->
  <rect x="280" y="210" width="540" height="100" rx="10" fill="#f0f4e8" stroke="#6e8a4a" stroke-width="1.5"/>
  <text x="550" y="252" text-anchor="middle" font-size="30" font-weight="700" fill="#3d4f24">RULES</text>
  <text x="550" y="282" text-anchor="middle" font-size="16" font-style="italic" fill="#555">project-wide constraints, stable across cycles</text>

  <line x1="550" y1="320" x2="550" y2="365" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="347" text-anchor="start" font-size="15" font-style="italic" fill="#444">constrain</text>

  <!-- Layer 2: PLANS -->
  <rect x="280" y="370" width="540" height="100" rx="10" fill="#fff5d4" stroke="#b78a1f" stroke-width="1.5"/>
  <text x="550" y="412" text-anchor="middle" font-size="30" font-weight="700" fill="#6a4f00">PLANS</text>
  <text x="550" y="442" text-anchor="middle" font-size="16" font-style="italic" fill="#555">per-subsection blueprint — review gate before any prose</text>

  <line x1="550" y1="480" x2="550" y2="525" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="507" text-anchor="start" font-size="15" font-style="italic" fill="#444">approved → prose emits</text>

  <!-- Layer 3: MANUSCRIPT -->
  <rect x="280" y="530" width="540" height="100" rx="10" fill="#fceee8" stroke="#a85c3a" stroke-width="1.5"/>
  <text x="550" y="572" text-anchor="middle" font-size="30" font-weight="700" fill="#6b3520">MANUSCRIPT</text>
  <text x="550" y="602" text-anchor="middle" font-size="16" font-style="italic" fill="#555">the draft itself, with self-review per subsection</text>

  <!-- Footer -->
  <text x="550" y="685" text-anchor="middle" font-size="13" font-style="italic" fill="#888">
    One full round = approve a plan → manuscript updates → you diff &amp; annotate → next subsection.
  </text>
</svg>
