<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="system-ui, -apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#ffffff"/>

  <!-- Title + subtitle -->
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#222">
    Three layers, one pipeline
  </text>
  <text x="550" y="60" text-anchor="middle" font-size="14" fill="#777">
    Rules constrain everything below · Plans gate the prose · Manuscript carries the draft
  </text>

  <!-- Column headers -->
  <text x="290" y="102" text-anchor="end" font-size="14" font-weight="600" fill="#c0392b" letter-spacing="0.04em">
    YOU — in LLMRedPen
  </text>
  <text x="810" y="102" text-anchor="start" font-size="14" font-weight="600" fill="#444" letter-spacing="0.04em">
    WRITING AGENT
  </text>

  <!-- =========================================================== -->
  <!-- Layer 1: RULES (top — the standing constraints)             -->
  <!-- =========================================================== -->
  <rect x="320" y="130" width="460" height="100" rx="10" fill="#f0f4e8" stroke="#6e8a4a" stroke-width="1.5"/>
  <text x="550" y="172" text-anchor="middle" font-size="30" font-weight="700" fill="#3d4f24">RULES</text>
  <text x="550" y="200" text-anchor="middle" font-size="14" font-style="italic" fill="#555">project-wide constraints, stable across cycles</text>

  <!-- User-side role for RULES -->
  <text x="290" y="184" text-anchor="end" font-size="13" font-style="italic" fill="#555">maintain (rare)</text>
  <line x1="300" y1="180" x2="320" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Agent-side role for RULES -->
  <line x1="800" y1="180" x2="780" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="810" y="184" text-anchor="start" font-size="13" font-style="italic" fill="#555">consult</text>

  <!-- Arrow + label down to PLANS -->
  <line x1="550" y1="240" x2="550" y2="295" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="272" text-anchor="start" font-size="13" font-style="italic" fill="#555">constrain</text>

  <!-- =========================================================== -->
  <!-- Layer 2: PLANS (middle — the gate)                          -->
  <!-- =========================================================== -->
  <rect x="320" y="300" width="460" height="100" rx="10" fill="#fff5d4" stroke="#b78a1f" stroke-width="1.5"/>
  <text x="550" y="342" text-anchor="middle" font-size="30" font-weight="700" fill="#6a4f00">PLANS</text>
  <text x="550" y="370" text-anchor="middle" font-size="14" font-style="italic" fill="#555">per-subsection blueprint — review gate before any prose</text>

  <!-- User-side role for PLANS -->
  <text x="290" y="354" text-anchor="end" font-size="13" font-style="italic" fill="#555">review · approve</text>
  <line x1="300" y1="350" x2="320" y2="350" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Agent-side role for PLANS -->
  <line x1="800" y1="350" x2="780" y2="350" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="810" y="354" text-anchor="start" font-size="13" font-style="italic" fill="#555">draft · revise</text>

  <!-- Arrow + label down to MANUSCRIPT -->
  <line x1="550" y1="410" x2="550" y2="465" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="442" text-anchor="start" font-size="13" font-style="italic" fill="#555">approved → prose emits</text>

  <!-- =========================================================== -->
  <!-- Layer 3: MANUSCRIPT (bottom — the draft)                    -->
  <!-- =========================================================== -->
  <rect x="320" y="470" width="460" height="100" rx="10" fill="#fceee8" stroke="#a85c3a" stroke-width="1.5"/>
  <text x="550" y="512" text-anchor="middle" font-size="30" font-weight="700" fill="#6b3520">MANUSCRIPT</text>
  <text x="550" y="540" text-anchor="middle" font-size="14" font-style="italic" fill="#555">the draft itself, with self-review per subsection</text>

  <!-- User-side role for MANUSCRIPT -->
  <text x="290" y="524" text-anchor="end" font-size="13" font-style="italic" fill="#555">annotate · diff</text>
  <line x1="300" y1="520" x2="320" y2="520" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Agent-side role for MANUSCRIPT -->
  <line x1="800" y1="520" x2="780" y2="520" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="810" y="524" text-anchor="start" font-size="13" font-style="italic" fill="#555">emit · self-review</text>

  <!-- Footer: round-loop hint -->
  <text x="550" y="600" text-anchor="middle" font-size="12" font-style="italic" fill="#888">
    One full round = approve a plan → manuscript updates → you diff &amp; annotate → next subsection.
  </text>
</svg>
