<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="system-ui, -apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrow-small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="#ffffff"/>

  <!-- Title + subtitle -->
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#222">
    Three layers, one pipeline
  </text>
  <text x="550" y="62" text-anchor="middle" font-size="15" fill="#777">
    Rules constrain everything below · Plans gate the prose · Manuscript carries the draft
  </text>

  <!-- =========================================================== -->
  <!-- Dialogue channel (dashed) connecting the YOU panel and the  -->
  <!-- AGENT panel at the top — visualises the round-by-round      -->
  <!-- conversation between the two parties.                       -->
  <!-- =========================================================== -->
  <text x="550" y="98" text-anchor="middle" font-size="13" font-style="italic" fill="#999" letter-spacing="0.06em">
    rounds of comments + revisions
  </text>
  <line x1="240" y1="115" x2="860" y2="115" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- =========================================================== -->
  <!-- LEFT PANEL — YOU                                            -->
  <!-- =========================================================== -->
  <rect x="30" y="130" width="200" height="540" rx="10" fill="#fef6f3" stroke="#e8b4a5" stroke-width="1.5"/>

  <!-- Person icon -->
  <g transform="translate(70, 168)">
    <circle cx="0" cy="-8" r="8" fill="#c0392b"/>
    <path d="M-13,16 Q-13,2 0,2 Q13,2 13,16 Z" fill="#c0392b"/>
  </g>
  <text x="100" y="165" text-anchor="start" font-size="18" font-weight="700" fill="#c0392b" letter-spacing="0.04em">YOU</text>
  <text x="100" y="184" text-anchor="start" font-size="11" font-style="italic" fill="#999">in LLMRedPen</text>

  <!-- Separator inside left panel -->
  <line x1="42" y1="200" x2="218" y2="200" stroke="#f0d4cc" stroke-width="1"/>

  <!-- Role labels (right-aligned, aligned with each card's vertical centre) -->
  <text x="215" y="265" text-anchor="end" font-size="18" font-style="italic" fill="#333">maintain (rare)</text>
  <text x="215" y="425" text-anchor="end" font-size="18" font-style="italic" fill="#333">review · approve</text>
  <text x="215" y="585" text-anchor="end" font-size="18" font-style="italic" fill="#333">annotate · diff</text>

  <!-- Arrows from left panel labels into the cards -->
  <line x1="232" y1="260" x2="278" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>
  <line x1="232" y1="420" x2="278" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>
  <line x1="232" y1="580" x2="278" y2="580" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>

  <!-- =========================================================== -->
  <!-- RIGHT PANEL — WRITING AGENT                                 -->
  <!-- =========================================================== -->
  <rect x="870" y="130" width="200" height="540" rx="10" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5"/>

  <text x="1000" y="165" text-anchor="end" font-size="18" font-weight="700" fill="#333" letter-spacing="0.04em">AGENT</text>
  <text x="1000" y="184" text-anchor="end" font-size="11" font-style="italic" fill="#999">the LLM</text>

  <!-- Robot icon -->
  <g transform="translate(1030, 168)">
    <line x1="0" y1="-14" x2="0" y2="-18" stroke="#555" stroke-width="1.5"/>
    <circle cx="0" cy="-20" r="2.5" fill="#555"/>
    <rect x="-12" y="-14" width="24" height="22" rx="3" fill="#555"/>
    <circle cx="-4.5" cy="-7" r="2.4" fill="#fff"/>
    <circle cx="4.5" cy="-7" r="2.4" fill="#fff"/>
    <rect x="-5.5" y="-1" width="11" height="2.6" rx="1" fill="#fff"/>
  </g>

  <!-- Separator inside right panel -->
  <line x1="882" y1="200" x2="1058" y2="200" stroke="#ddd" stroke-width="1"/>

  <!-- Role labels (left-aligned, aligned with each card's vertical centre) -->
  <text x="885" y="265" text-anchor="start" font-size="18" font-style="italic" fill="#333">consult</text>
  <text x="885" y="425" text-anchor="start" font-size="18" font-style="italic" fill="#333">draft · revise</text>
  <text x="885" y="585" text-anchor="start" font-size="18" font-style="italic" fill="#333">emit · self-review</text>

  <!-- Arrows from right panel labels into the cards -->
  <line x1="868" y1="260" x2="822" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>
  <line x1="868" y1="420" x2="822" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>
  <line x1="868" y1="580" x2="822" y2="580" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-small)"/>

  <!-- =========================================================== -->
  <!-- Centre column: the three layer cards (the pipeline)         -->
  <!-- =========================================================== -->

  <!-- Layer 1: RULES -->
  <rect x="280" y="210" width="540" height="100" rx="10" fill="#f0f4e8" stroke="#6e8a4a" stroke-width="1.5"/>
  <text x="550" y="252" text-anchor="middle" font-size="30" font-weight="700" fill="#3d4f24">RULES</text>
  <text x="550" y="282" text-anchor="middle" font-size="16" font-style="italic" fill="#555">project-wide constraints, stable across cycles</text>

  <!-- Inter-card arrow + label: RULES → PLANS -->
  <line x1="550" y1="320" x2="550" y2="365" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="347" text-anchor="start" font-size="15" font-style="italic" fill="#444">constrain</text>

  <!-- Layer 2: PLANS -->
  <rect x="280" y="370" width="540" height="100" rx="10" fill="#fff5d4" stroke="#b78a1f" stroke-width="1.5"/>
  <text x="550" y="412" text-anchor="middle" font-size="30" font-weight="700" fill="#6a4f00">PLANS</text>
  <text x="550" y="442" text-anchor="middle" font-size="16" font-style="italic" fill="#555">per-subsection blueprint — review gate before any prose</text>

  <!-- Inter-card arrow + label: PLANS → MANUSCRIPT -->
  <line x1="550" y1="480" x2="550" y2="525" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="507" text-anchor="start" font-size="15" font-style="italic" fill="#444">approved → prose emits</text>

  <!-- Layer 3: MANUSCRIPT -->
  <rect x="280" y="530" width="540" height="100" rx="10" fill="#fceee8" stroke="#a85c3a" stroke-width="1.5"/>
  <text x="550" y="572" text-anchor="middle" font-size="30" font-weight="700" fill="#6b3520">MANUSCRIPT</text>
  <text x="550" y="602" text-anchor="middle" font-size="16" font-style="italic" fill="#555">the draft itself, with self-review per subsection</text>

  <!-- Footer: round-loop hint -->
  <text x="550" y="685" text-anchor="middle" font-size="13" font-style="italic" fill="#888">
    One full round = approve a plan → manuscript updates → you diff &amp; annotate → next subsection.
  </text>
</svg>
